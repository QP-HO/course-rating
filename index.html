 const {data:{session}}=await sb.auth.getSession();
 if(!session)return app(`<div class="panel" style="text-align:center"><h2>請先登入</h2><div class="sub">使用學校 Google 帳號登入後即可查看與貢獻課程評分。</div><button id="li">使用 Google 登入</button></div>`),$('li').onclick=()=>{sessionStorage.setItem('c',cur);sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+location.pathname}})};
 me=session.user;
 const p=await sb.from('profiles').select('role').eq('id',me.id).maybeSingle();role=p.data?.role||null;
 if(!role||role==='blocked')return app(`<div class="panel"><h2>此帳號無法使用</h2><div class="sub">${esc(me.email)} 不在允許名單內。請改用學校信箱登入，或聯絡管理人。</div><button class="g" id="lo">登出</button></div>`),$('lo').onclick=out;
 await loadAll();shell();renderAll();
}
async function out(){await sb.auth.signOut();location.href=location.origin+location.pathname}
async function loadAll(){
 const rows=[];for(let i=0;;i+=1000){const r=await sb.from('entries').select('*').order('created_at',{ascending:false}).range(i,i+999);if(r.error){alert('讀取失敗：'+r.error.message);break}rows.push(...r.data);if(r.data.length<1000)break}
 E=rows;const s=await sb.rpc('review_stats');ST={};(s.data||[]).forEach(r=>(ST[r.course_id]=ST[r.course_id]||[]).push(r));
 const m=await sb.rpc('my_count');mine=m.data||0;
 if(adm()){const p=await sb.from('profiles').select('*').order('created_at');profiles=p.data||[]}
}
function shell(){app(`<div class="warn" id="role"></div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px"><button class="g" id="shAll">複製整站連結</button><button class="g" id="shCur">複製目前課程連結</button><button class="g" id="lo">登出</button></div><div id="adm"></div>
 <div class="layout"><div class="side"><input id="q" placeholder="搜尋課名／老師"><select id="cat" style="margin-top:6px"><option value="all">全部類別</option>${Object.entries(CATS).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select><div class="list" id="list"></div></div><div class="panel" id="main"></div></div>
 <div class="panel" style="margin-top:16px"><h2>其它建議</h2><div class="tip">${TIPS.map(t=>`<div><b>${t[0]}</b><br>${t[1]}</div>`).join('')}</div></div>`);
 $('q').oninput=renderSide;$('cat').onchange=renderSide;$('lo').onclick=out;
 const base=location.origin+location.pathname;$('shAll').onclick=()=>cp(base);$('shCur').onclick=()=>cp(base+'?c='+cur);
}
function renderAll(){roleBar();renderSide();renderMain();renderAdmin()}
function roleBar(){$('role').innerHTML=`${esc(me.email)}　身分：<b style="color:var(--lamp)">${RN[role]}</b>　`+(staff()?'可閱讀全部評語；'+(adm()?'可核准、匯入、匯出、刪除、指派身分。':'可核准與批次匯入。'):`貢獻進度 ${Math.min(mine,MIN)}/${MIN}（分數、評語、書籍皆計入）`+(mine>=MIN?'　已解鎖他人評語。':'　再貢獻 '+(MIN-mine)+' 筆即可閱讀他人評語。'))}
function renderSide(){const q=$('q').value.trim(),cat=$('cat').value;
 $('list').innerHTML=COURSES.filter(c=>(cat==='all'||c.c===cat)&&(!q||(c.n+c.t).includes(q))).map(c=>{const n=stat(c.id).n;return `<div class="item ${c.id===cur?'on':''}" data-id="${c.id}">${esc(c.n)}${n?`<span class="badge">${n} 則評語</span>`:''}<small>${esc(c.t)}・${esc(c.y)}</small></div>`}).join('')||'<div class="empty">無符合課程</div>';
 $('list').querySelectorAll('.item').forEach(e=>e.onclick=()=>{cur=e.dataset.id;tf='';history.replaceState(null,'','?c='+cur);renderSide();renderMain()})}
const SEMS=['115-1','114-2','114-1','113-2','113-1','112-2','112-1'],semOpts=SEMS.map(s=>`<option>${s}</option>`).join('');
async function addRow(o){const {error}=await sb.from('entries').insert({...o,course_id:cur,status:staff()?'approved':'pending'});if(error)return alert('送出失敗：'+error.message);alert(staff()?'已發布':'已送出，待管理員審核後顯示。');await loadAll();renderAll()}
function renderMain(){
 const c=COURSES.find(x=>x.id===cur),A=E.filter(e=>e.course_id===cur&&e.status==='approved'&&(!tf||e.teacher===tf)),dt=tf||TS(c)[0]||c.t;
 const S=A.filter(e=>e.kind==='score'),R=A.filter(e=>e.kind==='review'),B=[...(SEED_BOOKS[cur]||[]),...A.filter(e=>e.kind==='book')];
 const st=stat(cur,tf),sv=S.map(e=>+e.score),myPend=E.filter(e=>e.course_id===cur&&e.status==='pending'&&e.user_id===me.id).length;
 const bins=[['90–100',90,101],['80–89',80,90],['70–79',70,80],['60–69',60,70],['<60',0,60]],sems=[...new Set(S.map(e=>e.sem))].sort().reverse();
 const total=+st.n||0,own=R.filter(e=>e.user_id===me.id).length;
 const rv=e=>`<div class="rev"><div class="m">${esc(e.sem)}・推薦 ${'★'.repeat(e.rate)}${'☆'.repeat(5-e.rate)}　<span class="tag">甜度 ${e.sweet}</span><span class="tag">負擔 ${e.workload}</span>${e.teacher?`<span class="tag">${esc(e.teacher)}</span>`:''}<span class="tag">${esc(e.exam||'')}</span>${adm()?`<button class="g" data-del="${e.id}" style="float:right;padding:1px 8px;font-size:11px">刪除</button>`:''}</div>${esc(e.body)}</div>`;
 const reviewHtml=!total?'<div class="empty">尚無評語。</div>':(canSee()?'':`<div class="rev">🔒 此課共有 ${total} 則評語。需先貢獻至少 ${MIN} 筆資料（目前 ${Math.min(mine,MIN)}/${MIN}）才能閱讀他人評語。${own?'下方僅顯示您自己的評語。':''}</div>`)+R.map(rv).join('');
 $('main').innerHTML=`<a class="back">${esc(c.id)}・${esc(c.y)}・${CATS[c.c]||''}${c.cr?`・${c.cr} 學分`:''}${c.s?`・${c.s} 開課`:''}</a><h2>${esc(c.n)}</h2><div class="sub">${esc(c.t)} 老師${c.h?`　歷屆：${c.h.map(esc).join('、')}`:''}${myPend?`　（您有 ${myPend} 筆待審）`:''}</div><div class="form" style="margin:4px 0 8px"><select id="tfs"><option value="">授課老師：全部</option>${TS(c).map(t=>`<option ${t===tf?'selected':''}>${esc(t)}</option>`).join('')}</select></div><datalist id="tl">${TS(c).map(t=>`<option value="${esc(t)}">`).join('')}</datalist>
 <div class="stats"><div class="stat"><b>${sv.length?f1(avg(sv)):'—'}</b><span>平均學期分數（${sv.length} 筆）</span></div><div class="stat"><b>${f1(st.avg_rate)}</b><span>綜合推薦度 / 5（${total} 則）</span></div><div class="stat"><b>${f1(st.avg_sweet)}</b><span>給分甜度 / 5</span></div><div class="stat"><b>${f1(st.avg_workload)}</b><span>課業負擔 / 5</span></div></div>
 <h3>1. 歷年學期分數與課排名參考</h3>${sv.length?bins.map(b=>{const n=sv.filter(v=>v>=b[1]&&v<b[2]).length;return `<div class="bar"><em>${b[0]}</em><i style="width:${n/sv.length*60}%"></i>${n}</div>`}).join(''):'<div class="empty">尚無分數資料。</div>'}
 ${sems.length?`<div class="sc"><table><tr><th>學期</th><th>筆數</th><th>平均</th><th>最高</th><th>最低</th><th>老師</th><th>課排名（名次／修課人數）</th></tr>${sems.map(s=>{const x=S.filter(e=>e.sem===s),v=x.map(e=>+e.score);return `<tr><td>${esc(s)}</td><td>${x.length}</td><td>${f1(avg(v))}</td><td>${Math.max(...v)}</td><td>${Math.min(...v)}</td><td>${[...new Set(x.map(e=>e.teacher).filter(Boolean))].map(esc).join('、')||'—'}</td><td>${x.filter(e=>e.rank_no).map(e=>e.rank_no+'/'+(e.total||'?')).join('、')||'—'}</td></tr>`}).join('')}</table></div>`:''}
 <div class="form"><select id="fs">${semOpts}</select><input id="fsc" type="number" min="0" max="100" placeholder="學期分數 0–100"><input id="frk" type="number" min="1" placeholder="課排名（名次，可空）"><input id="frt" type="number" min="1" placeholder="修課人數（可空）"><input id="fts" list="tl" maxlength="40" value="${esc(dt)}" placeholder="授課老師"><button id="bs">送出分數</button></div>
 <h3>2. 學生評語</h3>${reviewHtml}
 <div class="form"><select id="rs">${semOpts}</select><select id="rr">${[5,4,3,2,1].map(n=>`<option value="${n}" ${n==3?'selected':''}>推薦 ★${n}</option>`).join('')}</select>
 <select id="rsw"><option value="1">給分：很嚴 1</option><option value="2">2</option><option value="3" selected>3 普通</option><option value="4">4</option><option value="5">給分：很甜 5</option></select>
 <select id="rl"><option value="1">負擔：很輕 1</option><option value="2">2</option><option value="3" selected>3 普通</option><option value="4">4</option><option value="5">負擔：很重 5</option></select>
 <select id="re"><option>期中＋期末考</option><option>報告為主</option><option>作業＋考試</option><option>實習／實作</option><option>其他</option></select>
 <input class="full" id="ftr" list="tl" maxlength="40" value="${esc(dt)}" placeholder="授課老師"><textarea class="full" id="rt" rows="3" maxlength="400" placeholder="上課方式、考試重點、給分習慣、建議…（勿含人身攻擊與個資）"></textarea><button id="br">送出評語</button></div>
 <h3>3. 上課書籍推薦</h3>${B.length?B.map(b=>`<div class="rev"><b>${esc(b.title)}</b><div class="m">${esc(b.note||'')}</div></div>`).join(''):'<div class="empty">尚無書籍推薦。</div>'}
 <div class="form"><input class="full" id="bt" maxlength="80" placeholder="書名／作者／版本（或「老師自編講義」）"><input class="full" id="bn" maxlength="120" placeholder="推薦理由"><button id="bb">送出推薦</button></div>`;
 $('main').querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(!confirm('確定刪除這則已發布評語？'))return;const r=await sb.from('entries').delete().eq('id',b.dataset.del);if(r.error)return alert(r.error.message);await loadAll();renderAll()});
 $('tfs').onchange=()=>{tf=$('tfs').value;renderMain()};
 $('bs').onclick=()=>{if(!$('fts').value.trim())return alert('請填寫授課老師');const v=$('fsc').value;if(v===''||!(+v>=0&&+v<=100))return alert('請輸入 0–100 的分數');if($('frk').value&&$('frt').value&&+$('frk').value>+$('frt').value)return alert('名次不能大於修課人數');addRow({kind:'score',teacher:$('fts').value.trim(),sem:$('fs').value,score:+v,rank_no:+$('frk').value||null,total:+$('frt').value||null})};
 $('br').onclick=()=>{if(!$('ftr').value.trim())return alert('請填寫授課老師');const t=$('rt').value.trim();if(t.length<5)return alert('評語至少 5 個字');addRow({kind:'review',teacher:$('ftr').value.trim(),sem:$('rs').value,rate:+$('rr').value,sweet:+$('rsw').value,workload:+$('rl').value,exam:$('re').value,body:t})};
 $('bb').onclick=()=>{const t=$('bt').value.trim();if(!t)return alert('請輸入書名');addRow({kind:'book',title:t,note:$('bn').value.trim()||null})};
}
function renderAdmin(){const a=$('adm');if(!staff()){a.innerHTML='';return}
 const keep=a.querySelector('details')?.open,P=E.filter(e=>e.status==='pending').sort((x,y)=>x.created_at<y.created_at?-1:1);
 const KN={score:'分數',review:'評語',book:'書籍'},ds=e=>e.kind==='score'?`${e.sem}・${e.score} 分・排名 ${e.rank_no||'—'}/${e.total||'?'}`:e.kind==='review'?`${e.sem}・★${e.rate}・甜${e.sweet}/負擔${e.workload}・${e.body}`:`${e.title}　${e.note||''}`;
 a.innerHTML=`<details class="panel" style="margin-bottom:16px" ${keep||P.length?'open':''}><summary style="cursor:pointer;font-weight:700">管理區　待審 ${P.length} 筆</summary><h3>審核</h3>
 ${P.length?P.map(e=>{const c=COURSES.find(x=>x.id===e.course_id)||{};return `<div class="rev"><div class="m">${esc(c.n||e.course_id)}・${KN[e.kind]}</div>${esc((e.teacher?e.teacher+'・':'')+ds(e))}<div style="margin-top:6px"><button data-ok="${e.id}">核准</button> <button class="g" data-no="${e.id}">退回</button></div></div>`}).join(''):'<div class="empty">沒有待審內容。</div>'}
 <h3>歷年成績批次匯入</h3><div class="sub">每行一筆，逗號或 Tab 分隔：課號或課名, 學期, 分數, 課排名(可空), 修課人數(可空), 授課老師(可空)。例：N3030,113-2,86,5,42,王大明。可從 Excel 複製貼上或選 .csv 檔。</div>
 <textarea id="imp" rows="5" placeholder="N3030,113-2,86,5,42,王大明"></textarea><div class="form"><input type="file" id="impf" accept=".csv,.txt"><button id="impb">匯入（直接發布）</button></div><div id="impr" class="sub"></div>
 <h3>資料備份</h3><button class="g" id="exp">匯出已發布資料（CSV）</button>
 ${adm()?`<h3>身分管理</h3><div class="sc"><table><tr><th>信箱</th><th>身分</th></tr>${profiles.map(p=>`<tr><td>${esc(p.email)}</td><td><select data-role="${p.id}" ${p.id===me.id?'disabled':''}>${['admin','association','student','blocked'].map(r=>`<option value="${r}" ${p.role===r?'selected':''}>${RN[r]||'停用'}</option>`).join('')}</select></td></tr>`).join('')}</table></div>`:''}</details>`;
 a.querySelectorAll('[data-ok]').forEach(b=>b.onclick=async()=>{const r=await sb.from('entries').update({status:'approved'}).eq('id',b.dataset.ok);if(r.error)return alert(r.error.message);await loadAll();renderAll()});
 a.querySelectorAll('[data-no]').forEach(b=>b.onclick=async()=>{if(!confirm('確定退回並刪除？'))return;const r=await sb.from('entries').delete().eq('id',b.dataset.no);if(r.error)return alert(r.error.message);await loadAll();renderAll()});
 a.querySelectorAll('[data-role]').forEach(s=>s.onchange=async()=>{const r=await sb.from('profiles').update({role:s.value}).eq('id',s.dataset.role);if(r.error)alert(r.error.message);await loadAll();renderAll()});
 $('impf').onchange=ev=>{const f=ev.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$('imp').value=r.result};r.readAsText(f,'utf-8')};
 $('impb').onclick=async()=>{const rows=[],bad=[];$('imp').value.split(/\r?\n/).map(l=>l.trim()).filter(Boolean).forEach((l,k)=>{const f=l.split(/[,\t]/).map(x=>x.trim().replace(/^"|"$/g,''));if(/^課/.test(f[0]))return;
   const cs=COURSES.filter(c=>c.id===f[0]||c.n===f[0]),sc=+f[2];if(cs.length!==1||!f[1]||f[2]===''||!(sc>=0&&sc<=100))return bad.push(`第${k+1}行：${cs.length>1?'課名重複請改用課號':'欄位有誤'}`);
   const rk=+f[3]||null,tt=+f[4]||null;if(rk&&tt&&rk>tt)return bad.push(`第${k+1}行：名次大於人數`);
   rows.push({course_id:cs[0].id,kind:'score',sem:f[1],score:sc,rank_no:rk,total:tt,teacher:(f[5]||'').slice(0,40)||null,status:'approved',imported:true})});
  let ok=0;for(let i=0;i<rows.length;i+=200){const r=await sb.from('entries').insert(rows.slice(i,i+200));if(r.error){bad.push('寫入失敗：'+r.error.message);break}ok+=Math.min(200,rows.length-i);$('impr').textContent='匯入中… '+ok}
  $('impr').textContent=`完成：成功 ${ok} 筆；失敗 ${bad.length} 筆。`+bad.slice(0,8).join('；');await loadAll();renderAll();$('adm').querySelector('details').open=true};
 $('exp').onclick=()=>{const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"',rows=['課號,課名,授課老師,類型,學期,分數,課排名,修課人數,推薦,甜度,負擔,內容'];
  E.filter(e=>e.status==='approved').forEach(e=>{const c=COURSES.find(x=>x.id===e.course_id)||{};rows.push([e.course_id,c.n,e.teacher,e.kind,e.sem,e.score,e.rank_no,e.total,e.rate,e.sweet,e.workload,e.body||e.title].map(q).join(','))});
  const u=URL.createObjectURL(new Blob(['\ufeff'+rows.join('\n')],{type:'text/csv'})),a2=document.createElement('a');a2.href=u;a2.download='course-ratings.csv';a2.click();URL.revokeObjectURL(u)};
}
boot();
</script></body></html>
